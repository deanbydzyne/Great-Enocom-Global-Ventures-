    }
    DATA=loaded;
    P=new Map(DATA.products.filter(p=>p.visible).map(p=>[p.id,p]));
    render();
  }catch(error){
    console.error("Unable to load product catalogue:",error);
    app.innerHTML='<section class="empty"><h2>Catalogue unavailable</h2><p>We could not load the product list. Please refresh the page and try again. If you opened a downloaded HTML file directly, open the hosted website instead.</p><button class="primary" id="retry-catalogue">Try again</button></section>';
    $("#retry-catalogue").onclick=loadCatalogue;
  }
}
loadCatalogue();
</script>
</body>
</html>
